name: Contract Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  PACT_BROKER_BASE_URL: https://fanduel-a13fd6f7.pactflow.io

jobs:
  consumer-publish:
    name: Publish consumer pact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Compute Pact version + branch
        run: |
          echo "PACT_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "PACT_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install mobile deps
        working-directory: ./mobile
        run: npm ci

      - name: Generate pact from consumer tests
        working-directory: ./mobile
        run: npm run test:contract

      - name: Publish pact to broker
        working-directory: ./mobile
        env:
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx pact-broker publish ./pact/pacts \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN" \
            --consumer-app-version "$PACT_VERSION" \
            --branch "$PACT_BRANCH"

  provider-verify:
    name: Verify provider & check can-i-deploy
    runs-on: ubuntu-latest
    needs: consumer-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Compute Pact version + branch
        run: |
          echo "PACT_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "PACT_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Verify provider against broker
        working-directory: ./backend
        env:
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACT_PROVIDER_VERSION: ${{ env.PACT_VERSION }}
          PACT_PROVIDER_BRANCH: ${{ env.PACT_BRANCH }}
        run: npm run test:contract

      - name: Can I deploy the backend to production?
        if: always()
        working-directory: ./backend
        env:
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant ScoreBookBackend \
            --version "$PACT_VERSION" \
            --to-environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

  record-deployment:
    name: Record production deployment
    runs-on: ubuntu-latest
    needs: provider-verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Compute Pact version
        run: echo "PACT_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Record backend deployment to production
        working-directory: ./backend
        env:
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          npx pact-broker record-deployment \
            --pacticipant ScoreBookBackend \
            --version "$PACT_VERSION" \
            --environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"
