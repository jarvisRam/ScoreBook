name: Web E2E (Hosted)

# Unmocked web tests, run against the deployed site and the real backend behind it.
# Data there is live or simulated, so these check that the pieces are wired together
# and healthy rather than asserting specific scores. Kept out of the PR pipeline on
# purpose (see web-e2e.yml for the mocked gate).

on:
  schedule:
    # Nightly, 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL of the hosted web app (defaults to the WEB_BASE_URL repo variable)'
        required: false

concurrency:
  group: web-e2e-live
  cancel-in-progress: false

jobs:
  web-e2e-live:
    name: Playwright against the hosted site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_TARGET: live
      BASE_URL: ${{ inputs.base_url || vars.WEB_BASE_URL || 'https://scorebook-web.vercel.app' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (Playwright)
        run: npm ci --ignore-scripts

      - name: Check hosted site is reachable
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --output /dev/null "$BASE_URL"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run hosted web E2E tests
        run: npx playwright test --project=chromium --project="Mobile Chrome"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 14
