name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # PHASE 1: Lint, Type Check, and Unit Tests
  # ============================================
  lint-and-test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarCloud needs full history to work out new code and blame
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint mobile
        working-directory: ./mobile
        run: npm run lint

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: TypeScript type check (mobile)
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: TypeScript type check (backend)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run mobile tests with coverage
        working-directory: ./mobile
        run: npm run test:coverage

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:ci

      # Jest writes paths relative to each package; Sonar resolves them from the repo root
      - name: Prefix LCOV paths with their package
        run: |
          sed -i 's#^SF:#SF:mobile/#' mobile/coverage/lcov.info
          sed -i 's#^SF:#SF:backend/#' backend/coverage/lcov.info

      # Secrets are not exposed to PRs from forks, so skip the scan there
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  # ============================================
  # PHASE 2: Build - Web
  # ============================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build web bundle
        working-directory: ./mobile
        run: npx expo export --platform web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: mobile/dist/
          retention-days: 7

  # ============================================
  # PHASE 2: Build - Android (Native)
  # ============================================
  build-android:
    name: Build Android (Native)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build Android APK
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  # ============================================
  # PHASE 2: Build - iOS (simulator build on a GitHub-hosted macOS runner)
  # ============================================
  # Runs `eas build --local` so the build uses this runner instead of Expo's
  # cloud builders (which are quota-limited). The `preview` profile is an iOS
  # simulator Release build, so no signing credentials are needed.
  #
  # Artifact `ios-simulator-build` contains ScoreBook-simulator.tar.gz, which
  # unpacks to mobile.app (bundle id com.anonymous.mobile). Consume it with:
  #   tar -xzf ScoreBook-simulator.tar.gz
  #   xcrun simctl install booted mobile.app
  # (A tarball is used because upload-artifact zips do not preserve the
  # symlinks and permissions inside an .app bundle.)
  build-ios:
    name: Build iOS (Simulator)
    runs-on: macos-15
    needs: lint-and-test
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # eas-cli 24.x requires Node >= 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: 24.13.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build iOS simulator app (local EAS build)
        working-directory: ./mobile
        run: |
          mkdir -p "$RUNNER_TEMP/ios-build"
          eas build --local --platform ios --profile preview --non-interactive \
            --output "$RUNNER_TEMP/ios-build/ScoreBook-simulator.tar.gz"

      - name: Verify build output
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ios-build/ScoreBook-simulator.tar.gz"
          ls -lh "$archive"
          tar -tzf "$archive" | head -20
          mkdir -p "$RUNNER_TEMP/ios-verify"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ios-verify"
          app=$(find "$RUNNER_TEMP/ios-verify" -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$app"
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleName'

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ${{ runner.temp }}/ios-build/ScoreBook-simulator.tar.gz
          if-no-files-found: error
          # already gzip-compressed
          compression-level: 0
          retention-days: 7

