name: Mobile E2E (Maestro)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - '.maestro/**'
      - '.github/workflows/maestro.yml'

jobs:
  maestro-android:
    name: Android Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start mock backend
        working-directory: ./backend
        run: |
          USE_MOCK_DATA=true npx ts-node src/index.ts &
          # Wait for backend to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health | grep -q '"mode":"mock"'; then
              echo "Backend ready in mock mode"
              break
            fi
            echo "Waiting for backend... ($i/15)"
            sleep 2
          done

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Prebuild Android (Expo)
        working-directory: ./mobile
        run: npx expo prebuild --platform android

      - name: Build Android APK (Debug)
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug

      # Without this the emulator runs with -accel off, boots very slowly and
      # `adb install` fails with a broken pipe
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The debug APK does not embed the JS bundle; at launch it requests it from
      # Metro on :8081. Without Metro the app shows "Unable to load script" and
      # the first Maestro assertion fails. Started after the Gradle build so the
      # two don't compete for memory.
      - name: Start Metro bundler
        working-directory: ./mobile
        run: |
          CI=1 npx expo start --offline --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/status | grep -q "packager-status:running"; then
              echo "Metro ready"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "Metro did not become ready"
              cat "$RUNNER_TEMP/metro.log"
              exit 1
            fi
            echo "Waiting for Metro... ($i/60)"
            sleep 2
          done

          # Warm Metro's transform cache so the app's first load on the emulator
          # isn't a cold bundle (which can outlast Maestro's default wait)
          curl -sf --max-time 300 -o /dev/null "http://localhost:8081/index.bundle?platform=android&dev=true&minify=false&lazy=true&transform.engine=hermes&transform.bytecode=1&unstable_transformProfile=hermes-stable"
          echo "Bundle warmed"

      - name: Run Maestro Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Let the app reach Metro on the host
            adb reverse tcp:8081 tcp:8081

            # Install the Debug APK
            adb install ./mobile/android/app/build/outputs/apk/debug/app-debug.apk

            # Run all Maestro flows
            maestro test .maestro/flow.yaml

      - name: Show Metro log
        if: always()
        run: cat "$RUNNER_TEMP/metro.log" || true
