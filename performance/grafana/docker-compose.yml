# Local dashboard for k6 results: k6 -> Prometheus (remote write) -> Grafana.
#
#   npm run perf:grafana:up        then open http://localhost:3030  (admin / admin)
#   K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9090/api/v1/write npm run perf:be
#
# CI does not use this stack: scheduled runs push to Grafana Cloud instead (see
# .github/workflows/performance-*.yml). The dashboard JSON is the same for both.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # k6 pushes here
      - --storage.tsdb.retention.time=90d    # long enough to see baseline drift
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - '3030:3000' # 3000 is the ScoreBook backend, 3001 is commonly taken by docs dev servers
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scorebook-performance.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
