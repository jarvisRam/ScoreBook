sonar.organization=jarvisram
sonar.projectKey=jarvisRam_ScoreBook
sonar.projectName=ScoreBook

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**,ios/**,.expo/**,playwright-report/**,test-results/**,**/package-lock.json

# Test code: backend Jest suites, mobile Jest suites, Pact specs and Playwright/Maestro suites.
# Files matching these are indexed as tests, so they are never measured for coverage.
sonar.test.inclusions=backend/test/**,mobile/src/__tests__/**,mobile/pact/**,tests/**

# Belt and braces: keep test code and fixtures out of coverage even if the globs above change.
sonar.coverage.exclusions=backend/test/**,mobile/src/__tests__/**,mobile/pact/**,tests/**,backend/scripts/**,**/*.d.ts,**/jest.config.js,**/jest.*.config.js,**/jest.setup.js

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,mobile/coverage/lcov.info
