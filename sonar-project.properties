sonar.organization=jarvisram
sonar.projectKey=jarvisRam_ScoreBook
sonar.projectName=ScoreBook

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**,ios/**,.expo/**,playwright-report/**,test-results/**,**/package-lock.json,backend/test/**,mobile/src/__tests__/**,mobile/pact/**,tests/**

# Test code: backend Jest suites, mobile Jest suites, Pact specs and Playwright/Maestro suites.
# sonar.tests=. plus these globs picks out the test files; they are excluded from main sources above
# so each file is indexed only once, as a test, and is never measured for coverage.
sonar.test.inclusions=backend/test/**,mobile/src/__tests__/**,mobile/pact/**,tests/**

# performance/ is k6 load-test scripts plus the tooling that runs them. k6 scripts execute in k6's own
# runtime, not Node, so they cannot produce lcov. Like backend/scripts, they are excluded from coverage.
# Belt and braces: keep test code and fixtures out of coverage even if the globs above change.
sonar.coverage.exclusions=performance/**,backend/test/**,mobile/src/__tests__/**,mobile/pact/**,tests/**,backend/scripts/**,**/*.d.ts,**/jest.config.js,**/jest.*.config.js,**/jest.setup.js

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,mobile/coverage/lcov.info
