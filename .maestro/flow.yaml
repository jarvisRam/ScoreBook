appId: com.anonymous.mobile
---
# Smoke test: verify app launches and all sport tabs are reachable
- launchApp
# First load pulls the JS bundle from Metro, which can be slow on a CI runner
- extendedWaitUntil:
    visible: "ScoreBook"
    timeout: 60000
- assertVisible: "Cricket"
- assertVisible: "American Football"
- assertVisible: "Hockey"

# Run per-sport flows
- runFlow: flows/cricket.yaml
- runFlow: flows/football.yaml
- runFlow: flows/hockey.yaml
- runFlow: flows/soccer.yaml
- runFlow: flows/tennis.yaml
- runFlow: flows/badminton.yaml
